
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>My Reservations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">

            My Reservations

        </span>

        <a href="/dashboard"
           class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">

        My Reservations

    </h2>

    <div
            th:if="${#lists.isEmpty(reservations)}"
            class="alert alert-info">

        You have no reservations yet.

    </div>

    <table
            th:if="${!#lists.isEmpty(reservations)}"
            class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>PNR</th>

            <th>Train</th>

            <th>From</th>

            <th>To</th>

            <th>Journey Date</th>

            <th>Passengers</th>

            <th>Total Fare</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="reservation : ${reservations}">

            <td th:text="${reservation.pnr}"></td>

            <td th:text="${reservation.train.trainName}"></td>

            <td th:text="${reservation.source}"></td>

            <td th:text="${reservation.destination}"></td>

            <td th:text="${reservation.journeyDate}"></td>

            <td th:text="${reservation.passengerCount}"></td>

            <td>

                ₹<span th:text="${reservation.totalFare}"></span>

            </td>

            <td>

                <span
                        th:if="${reservation.status == 'CONFIRMED'}"
                        class="badge bg-success">

                    CONFIRMED

                </span>

                <span
                        th:if="${reservation.status == 'CANCELLED'}"
                        class="badge bg-danger">

                    CANCELLED

                </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
