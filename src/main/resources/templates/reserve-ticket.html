<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reserve Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">
            Ticket Reservation
        </span>

        <a href="/user/search"
           class="btn btn-light">
            Back
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Reserve Ticket</h3>

        </div>

        <div class="card-body">

            <h5>
                Train:
                <span th:text="${train.trainName}"></span>
            </h5>

            <p>
                Train No:
                <span th:text="${train.trainNo}"></span>
            </p>

            <p>
                Route:
                <span th:text="${reservationForm.fromStation}"></span>
                →
                <span th:text="${reservationForm.toStation}"></span>
            </p>

            <p>
                Fare Per Passenger:
                ₹<span th:text="${fare}"></span>
            </p>

            <p>
                Available Seats:
                <span th:text="${train.availableSeats}"></span>
            </p>

            <hr>

            <form th:action="@{/reserve/{id}(id=${train.id})}"
                  th:object="${reservationForm}"
                  method="post">

                <input type="hidden"
                       th:field="*{fromStation}">

                <input type="hidden"
                       th:field="*{toStation}">

                <input type="hidden"
                       th:field="*{fare}">

                <div class="mb-3">

                    <label class="form-label">
                        Journey Date
                    </label>

                    <input type="date"
                           th:field="*{journeyDate}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Number of Passengers
                    </label>

                    <input type="number"
                           min="1"
                           max="6"
                           th:field="*{passengerCount}"
                           class="form-control"
                           required>

                    <small class="text-muted">
                        Maximum 6 passengers per booking.
                    </small>

                </div>

                <div class="alert alert-info">

                    <strong>Estimated Total Fare</strong>

                    <br>

                    Fare Per Passenger × Number of Passengers

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    Continue

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
