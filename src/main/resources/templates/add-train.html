```
<div class="card shadow">

    <div class="card-header">
        <h3>Add New Train</h3>
    </div>

    <div class="card-body">

        <form th:action="@{/admin/trains/add}"
              th:object="${train}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Train Number</label>
                    <input type="text"
                           th:field="*{trainNo}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Train Name</label>
                    <input type="text"
                           th:field="*{trainName}"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Train Type</label>
                    <select th:field="*{trainType}"
                            class="form-control">

                        <option value="Passenger">Passenger</option>
                        <option value="Express">Express</option>
                        <option value="Superfast">Superfast</option>
                        <option value="Rajdhani">Rajdhani</option>
                        <option value="Shatabdi">Shatabdi</option>

                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Base Fare (₹)</label>
                    <input type="number"
                           min="0"
                           th:field="*{baseFare}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Fare Per Station (₹)</label>
                    <input type="number"
                           min="0"
                           th:field="*{farePerStation}"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Source Station</label>
                    <input type="text"
                           th:field="*{sourceStation}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Destination Station</label>
                    <input type="text"
                           th:field="*{destinationStation}"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Departure Time</label>
                    <input type="text"
                           placeholder="16:00"
                           th:field="*{departureTime}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Arrival Time</label>
                    <input type="text"
                           placeholder="10:00"
                           th:field="*{arrivalTime}"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Total Seats</label>
                    <input type="number"
                           min="1"
                           th:field="*{totalSeats}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Available Seats</label>
                    <input type="number"
                           min="0"
                           th:field="*{availableSeats}"
                           class="form-control"
                           required>
                </div>

            </div>

            <button type="submit"
                    class="btn btn-success">
                Save Train
            </button>

        </form>

    </div>

</div>
```

</div>

</body>
</html>
