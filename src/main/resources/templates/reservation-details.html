```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Reservation Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">

            Reservation Details

        </span>

        <a href="/cancel-ticket"
           class="btn btn-light">

            Back

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                Reservation Information

            </h3>

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>

                    <th width="30%">PNR</th>

                    <td th:text="${reservation.pnr}"></td>

                </tr>

                <tr>

                    <th>Train</th>

                    <td th:text="${reservation.train.trainName}"></td>

                </tr>

                <tr>

                    <th>Journey Date</th>

                    <td th:text="${reservation.journeyDate}"></td>

                </tr>

                <tr>

                    <th>Source</th>

                    <td th:text="${reservation.source}"></td>

                </tr>

                <tr>

                    <th>Destination</th>

                    <td th:text="${reservation.destination}"></td>

                </tr>

                <tr>

                    <th>Passenger Count</th>

                    <td th:text="${reservation.passengerCount}"></td>

                </tr>

                <tr>

                    <th>Total Fare</th>

                    <td>

                        ₹<span th:text="${reservation.totalFare}"></span>

                    </td>

                </tr>

                <tr>

                    <th>Status</th>

                    <td>

                        <span
                                th:if="${reservation.status == 'CONFIRMED'}"
                                class="badge bg-success">

                            CONFIRMED

                        </span>

                        <span
                                th:if="${reservation.status == 'CANCELLED'}"
                                class="badge bg-danger">

                            CANCELLED

                        </span>

                    </td>

                </tr>

            </table>

            <div class="mt-4">

                <form
                        th:if="${reservation.status != 'CANCELLED'}"
                        th:action="@{/cancel-ticket/confirm}"
                        method="post">

                    <input type="hidden"
                           name="reservationId"
                           th:value="${reservation.id}">

                    <button
                            class="btn btn-danger"
                            onclick="return confirm('Are you sure you want to cancel this reservation?')">

                        Confirm Cancellation

                    </button>

                </form>

                <div
                        th:if="${reservation.status == 'CANCELLED'}"
                        class="alert alert-danger">

                    This reservation has already been cancelled.

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
```
