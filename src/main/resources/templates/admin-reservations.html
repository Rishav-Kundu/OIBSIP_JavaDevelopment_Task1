```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Reservations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">

            Reservations

        </span>

        <a href="/admin/dashboard"
           class="btn btn-light">

            Back

        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">

        Reservation List

    </h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>PNR</th>

            <th>User</th>

            <th>Train</th>

            <th>Journey Date</th>

            <th>Source</th>

            <th>Destination</th>

            <th>Passengers</th>

            <th>Total Fare</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="reservation : ${reservations}">

            <td th:text="${reservation.pnr}"></td>

            <td th:text="${reservation.user.name}"></td>

            <td th:text="${reservation.train.trainName}"></td>

            <td th:text="${reservation.journeyDate}"></td>

            <td th:text="${reservation.source}"></td>

            <td th:text="${reservation.destination}"></td>

            <td th:text="${reservation.passengerCount}"></td>

            <td>
                ₹<span th:text="${reservation.totalFare}"></span>
            </td>

            <td th:text="${reservation.status}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
```
