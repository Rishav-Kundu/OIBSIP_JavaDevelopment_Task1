<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Trains</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

```
    <span class="navbar-brand">
        Train Reservation System - Admin
    </span>

    <a href="/admin/dashboard"
       class="btn btn-light">
        Dashboard
    </a>

</div>
```

</nav>

<div class="container mt-5">

```
<div class="d-flex justify-content-between mb-3">

    <h2>Manage Trains</h2>

    <a href="/admin/trains/add"
       class="btn btn-success">
        Add Train
    </a>

</div>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

    <tr>
        <th>Train No</th>
        <th>Train Name</th>
        <th>Type</th>
        <th>Base Fare</th>
        <th>Fare / Station</th>
        <th>Source</th>
        <th>Destination</th>
        <th>Departure</th>
        <th>Arrival</th>
        <th>Seats</th>
        <th>Actions</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="train : ${trains}">

        <td th:text="${train.trainNo}"></td>

        <td th:text="${train.trainName}"></td>

        <td th:text="${train.trainType}"></td>

        <td>
            ₹<span th:text="${train.baseFare}"></span>
        </td>

        <td>
            ₹<span th:text="${train.farePerStation}"></span>
        </td>

        <td th:text="${train.sourceStation}"></td>

        <td th:text="${train.destinationStation}"></td>

        <td th:text="${train.departureTime}"></td>

        <td th:text="${train.arrivalTime}"></td>

        <td>
            <span th:text="${train.availableSeats}"></span>
            /
            <span th:text="${train.totalSeats}"></span>
        </td>

        <td>

            <a th:href="@{/admin/trains/{id}/routes(id=${train.id})}"
               class="btn btn-info btn-sm">
                Routes
            </a>

            <a th:href="@{/admin/trains/edit/{id}(id=${train.id})}"
               class="btn btn-warning btn-sm">
                Edit
            </a>

            <a th:href="@{/admin/trains/delete/{id}(id=${train.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Delete this train?')">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>
```

</div>

</body>
</html>
