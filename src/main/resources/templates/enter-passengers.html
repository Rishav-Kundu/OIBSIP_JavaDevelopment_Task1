```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Passenger Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">
            Passenger Details
        </span>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Enter Passenger Details</h3>

        </div>

        <div class="card-body">

            <form
                    th:action="@{/confirm-booking}"
                    th:object="${passengerDetailsForm}"
                    method="post">

                <input type="hidden"
                       th:field="*{trainId}"/>

                <input type="hidden"
                       th:field="*{fromStation}"/>

                <input type="hidden"
                       th:field="*{toStation}"/>

                <input type="hidden"
                       th:field="*{fare}"/>

                <input type="hidden"
                       th:field="*{journeyDate}"/>

                <input type="hidden"
                       th:field="*{passengerCount}"/>

                <div
                        th:each="passenger, stat : *{passengers}"
                        class="border rounded p-3 mb-4">

                    <h5>

                        Passenger
                        <span
                                th:text="${stat.index + 1}">
                        </span>

                    </h5>

                    <div class="mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{passengers[__${stat.index}__].name}"
                                required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Age

                        </label>

                        <input
                                type="number"
                                class="form-control"
                                min="1"
                                max="120"
                                th:field="*{passengers[__${stat.index}__].age}"
                                required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Gender

                        </label>

                        <select
                                class="form-select"
                                th:field="*{passengers[__${stat.index}__].gender}"
                                required>

                            <option value="">
                                Select
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

                <button
                        class="btn btn-success"
                        type="submit">

                    Confirm Booking

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
```
