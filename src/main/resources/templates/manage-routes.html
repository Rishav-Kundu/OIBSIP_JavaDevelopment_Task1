<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Routes</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>
<body>

<div class="container mt-5">

```
<div class="d-flex justify-content-between">

    <h2>
        Route - <span th:text="${train.trainName}"></span>
    </h2>

    <a th:href="@{/admin/trains/{id}/routes/add(id=${train.id})}"
       class="btn btn-success">
        Add Station
    </a>

</div>

<hr>

<table class="table table-bordered">

    <thead class="table-dark">

    <tr>
        <th>Order</th>
        <th>Station</th>
        <th>Arrival</th>
        <th>Departure</th>
        <th>Action</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="route : ${routes}">

        <td th:text="${route.stationOrder}"></td>

        <td th:text="${route.stationName}"></td>

        <td th:text="${route.arrivalTime}"></td>

        <td th:text="${route.departureTime}"></td>

        <td>

            <a th:href="@{/admin/routes/delete/{id}(id=${route.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Delete station?')">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>

<a href="/admin/trains"
   class="btn btn-secondary">
    Back
</a>
```

</div>

</body>
</html>
