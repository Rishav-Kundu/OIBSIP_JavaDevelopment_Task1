```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Cancel Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">

            Ticket Cancellation

        </span>

        <a href="/dashboard"
           class="btn btn-light">

            Back

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">

            <h3>

                Cancel Ticket Using PNR

            </h3>

        </div>

        <div class="card-body">

            <p class="text-muted">

                Enter your PNR number to search the reservation before cancelling.

            </p>
            <div th:if="${error}"
     class="alert alert-danger"
     th:text="${error}">
</div>

            <form th:action="@{/cancel-ticket/search}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">

                        PNR Number

                    </label>

                    <input type="text"
                           name="pnr"
                           class="form-control"
                           placeholder="Enter PNR"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-danger">

                    Search Reservation

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
```
