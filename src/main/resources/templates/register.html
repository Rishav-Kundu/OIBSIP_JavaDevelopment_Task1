```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>Train Reservation System</h3>

                    <h5>User Registration</h5>

                </div>

                <div class="card-body">

                    <form th:action="@{/register}"
                          th:object="${user}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">

                                Name

                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="d-grid mb-3">

                            <button type="submit"
                                    class="btn btn-primary">

                                Register

                            </button>

                        </div>

                    </form>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/}"
                           class="btn btn-secondary">

                            Back to Home

                        </a>

                        <a th:href="@{/login}"
                           class="btn btn-success">

                            Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
```
